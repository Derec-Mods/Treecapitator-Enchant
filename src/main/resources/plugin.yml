name: Treecapitator
version: '${version}'
main: io.github.derec4.treecapitator.TreecapitatorPlugin
api-version: '1.21'
prefix: Treecapitator
authors: [ DerexXD ]
description: Dynamic tree-felling axe enchant and treecapitator engine.
website: https://github.com/DereC4
commands:
  treecapitator:
    description: Treecapitator main command
    aliases: [tc]
    permission: treecapitator.use
permissions:
  treecapitator.use:
    description: Allowed to trigger the tree chop effect
    default: true
  treecapitator.bypass.cooldown:
    description: Bypass chopping cooldown
    default: op
  treecapitator.admin:
    description: Administrative permissions for Treecapitator
    default: op
